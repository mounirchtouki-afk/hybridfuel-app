<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HybridFuelCo — Fuel Plans for Hyrox & Hybrid Athletes</title>
    <meta name="description" content="Personal nutrition plans, a progress tracker and recipes for Hyrox & hybrid athletes." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HybridFuelCo" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
      /* Standaard-huisstijl (consumenten-app). Rustig wit/rood/zwart.
         Dark is de basis; light-overrides eronder. "Auto" volgt het systeem
         (prefers-color-scheme) zolang er geen expliciete data-theme op <html> staat.
         Sportscholen overschrijven deze per org via JS (applyOrgTheme). */
      :root {
        --hf-ink: #09090A; --hf-ink2: #161618; --hf-ember: #E11D48; --hf-ember-soft: #FB7185;
        --hf-paper: #F4F4F4; --hf-muted: #9A9AA0; --hf-line: #232326; --hf-sage: #CFC9CB;
        --hf-track: #242427;
        /* Gelaagde schaduw: dichtbij scherp + midden + ver zacht = echt verloop/diepte */
        --hf-shadow: 0 1px 2px rgba(0,0,0,0.40), 0 6px 14px rgba(0,0,0,0.48), 0 18px 38px rgba(0,0,0,0.60);
      }
      /* Light-tokens (zelfde rollen, omgedraaid): ink=achtergrond, ink2=kaart, paper=tekst.
         Diepere, zachte "zwevende" schaduw op de witte kaarten (zoals ChefLabels). */
      :root[data-theme="light"] {
        --hf-ink: #F4F3F6; --hf-ink2: #FFFFFF; --hf-paper: #16161A; --hf-muted: #6E6E78;
        --hf-line: #ECEBEF; --hf-sage: #5A5A62; --hf-track: #ECECEF;
        --hf-shadow: 0 1px 2px rgba(22,18,44,0.05), 0 8px 16px rgba(22,18,44,0.08), 0 22px 42px rgba(22,18,44,0.13);
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]):not([data-theme="light"]) {
          --hf-ink: #F4F3F6; --hf-ink2: #FFFFFF; --hf-paper: #16161A; --hf-muted: #6E6E78;
          --hf-line: #ECEBEF; --hf-sage: #5A5A62; --hf-track: #ECECEF;
          --hf-shadow: 0 1px 2px rgba(22,18,44,0.05), 0 8px 16px rgba(22,18,44,0.08), 0 22px 42px rgba(22,18,44,0.13);
        }
      }
      body { background: var(--hf-ink); transition: background 0.2s ease; }
    </style>
  </head>
  <body style="margin:0;background:var(--hf-ink);">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Cookie-consent alleen op web laden, niet in de native app (Capacitor).
      (function () {
        var native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        if (native) return;
        var s = document.createElement("script");
        s.src = "https://www.hybridfuelco.com/consent.js?v=2";
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
