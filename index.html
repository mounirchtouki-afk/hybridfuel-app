<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HybridFuelCo — Fuel Plans for Hyrox & Hybrid Athletes</title>
    <meta name="description" content="Personal nutrition plans, a progress tracker and recipes for Hyrox & hybrid athletes." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HybridFuelCo" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
      /* Standaard-huisstijl (consumenten-app). Rustig wit/rood/zwart.
         Dark is de basis; light-overrides eronder. "Auto" volgt het systeem
         (prefers-color-scheme) zolang er geen expliciete data-theme op <html> staat.
         Sportscholen overschrijven deze per org via JS (applyOrgTheme). */
      :root {
        --hf-ink: #09090A; --hf-ink2: #161618; --hf-ember: #E11D48; --hf-ember-soft: #FB7185;
        --hf-ember-rgb: 225, 29, 72; --hf-ember-deep: #9f1239;
        --hf-paper: #F4F4F4; --hf-muted: #9A9AA0; --hf-line: #232326; --hf-sage: #CFC9CB;
        --hf-track: #242427;
        /* Gelaagde, zachte schaduw: subtiel en realistisch (verloop/diepte, niet zwaar) */
        --hf-shadow: 0 2px 6px rgba(0,0,0,0.32), 0 8px 18px rgba(0,0,0,0.40), 0 18px 36px rgba(0,0,0,0.46);
        /* Achtergrond: warme rode zweem bovenaan die naar de basis vervaagt */
        --hf-bg: linear-gradient(180deg, #190D11 0px, #110A0D 180px, #09090A 380px);
      }
      /* Light-tokens (zelfde rollen, omgedraaid): ink=achtergrond, ink2=kaart, paper=tekst.
         Diepere, zachte "zwevende" schaduw op de witte kaarten (zoals ChefLabels). */
      :root[data-theme="light"] {
        --hf-ink: #F4F3F6; --hf-ink2: #FFFFFF; --hf-paper: #16161A; --hf-muted: #6E6E78;
        --hf-line: #ECEBEF; --hf-sage: #5A5A62; --hf-track: #ECECEF;
        --hf-shadow: 0 1px 2px rgba(16,24,40,0.06), 0 4px 12px rgba(16,24,40,0.09), 0 16px 34px rgba(16,24,40,0.10);
        --hf-bg: linear-gradient(180deg, #FBE9ED 0px, #F7EEF1 180px, #F6F5F7 380px);
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]):not([data-theme="light"]) {
          --hf-ink: #F4F3F6; --hf-ink2: #FFFFFF; --hf-paper: #16161A; --hf-muted: #6E6E78;
          --hf-line: #ECEBEF; --hf-sage: #5A5A62; --hf-track: #ECECEF;
          --hf-shadow: 0 1px 2px rgba(16,24,40,0.06), 0 4px 12px rgba(16,24,40,0.09), 0 16px 34px rgba(16,24,40,0.10);
          --hf-bg: linear-gradient(180deg, #FBE9ED 0px, #F7EEF1 180px, #F6F5F7 380px);
        }
      }
      body { background: var(--hf-ink); transition: background 0.2s ease; }
    </style>
    <script src="/boot.js"></script>
  </head>
  <body style="margin:0;background:var(--hf-ink);">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
