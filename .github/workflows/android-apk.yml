name: Build Android APK

# Bouwt een installeerbare debug-APK in de cloud (GitHub-servers hebben internet,
# dus de Android-SDK + Gradle-deps worden hier wél opgehaald). De APK verschijnt
# als artifact onderaan de run (tab "Actions" -> deze run -> "Artifacts").
on:
  push:
    branches: [capacitor-wrap]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # De ubuntu-latest runner heeft de Android-SDK al voorgeïnstalleerd
      # (ANDROID_HOME/ANDROID_SDK_ROOT gezet, licenties geaccepteerd), dus
      # geen aparte setup-android-stap nodig; Gradle gebruikt die SDK.

      - name: Install deps
        run: npm ci

      - name: Build web (native config, absolute API)
        run: npx cross-env VITE_API_BASE=https://app.hybridfuelco.com vite build

      - name: Kopieer web-assets naar android
        # cap copy/sync struikelt op de TS-config in CI; het android-project heeft
        # de config + plugins al ingebakken, dus we verversen alleen de web-assets.
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Android SDK licenties accepteren
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hybridfuelco-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
